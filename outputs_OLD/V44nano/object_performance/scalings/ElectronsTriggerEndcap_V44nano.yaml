ElectronsTriggerEndcap:
  binning:
    max: 100
    min: 0
    step: 1.5
  match_test_to_ref: true
  reference_object:
    GenPart:electron_trigger_endcap: pt
  sample: DYLL_M50
  scalings:
    method: naive
    threshold: 0.95
  test_objects:
    L1EG:default:endcap: pt
    L1tkElectron:Iso:endcap: pt
    L1tkElectron:NoIso:endcap: pt
  thresholds:
  - 10
  - 20
  - 30
  - 40
  version: V44nano
  xlabel: Gen. pT (GeV)
  ylabel: Trigger Efficiency (endcap, L1 $p_T > <threshold>$ GeV)
