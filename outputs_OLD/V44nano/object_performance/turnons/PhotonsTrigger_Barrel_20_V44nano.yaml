PhotonsTrigger_Barrel:
  binning:
    max: 100
    min: 0
    step: 1.5
  match_test_to_ref: true
  reference_object:
    GenPart:photon:barrel_photon: pt
  sample: Hgg
  scalings:
    method: naive
    threshold: 0.95
  test_objects:
    L1EG:default:barrel: pt
    L1tkPhoton:Iso:barrel: pt
    L1tkPhoton:NoIso:barrel: pt
  thresholds:
  - 10
  - 20
  - 30
  - 40
  version: V44nano
  xlabel: Gen. pT (GeV)
  ylabel: Trigger Efficiency (barrel, L1 $p_T > <threshold>$ GeV)
