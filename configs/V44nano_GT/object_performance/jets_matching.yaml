JetMatchingBarrel:
  sample: TT
  version: V44nano_GT
  match_test_to_ref: True
  reference_object:
    GenJet:jet:barrel: "pt"
  test_objects:
    L1puppiJetSC4:default: "pt"
    L1GTsc4Jet:default: "pt"
    ### No GT object aavailable atm 
    # L1puppiJetHisto:default: "pt"
    # L1caloJet:default: "pt"
    # L1TrackJet:default: "pt"
  xlabel: "Gen. $p_T$ (GeV)"
  ylabel: "Matching Efficiency (barrel)"
  binning:
    min: 0
    max: 500
    step: 10

