PhotonsTrigger_Barrel:
  sample: Hgg
  version: V44nano_GT
  match_test_to_ref: True
  reference_object:
    GenPart:photon:barrel: "pt" 
  test_objects:
    # L1EG:default:barrel: "pt" No GT object available atm 
    L1tkPhoton:NoIso:barrel: "pt"
    L1tkPhoton:Iso:barrel: "pt"
    L1GTtkPhoton:NoIso:barrel: "pt"
    L1GTtkPhoton:Iso:barrel: "pt"
  thresholds: [10, 20, 30, 40]
  scalings:
    method: "naive"
    threshold: 0.95
  xlabel: "Gen. pT (GeV)"
  ylabel: "Trigger Efficiency (barrel, L1 $p_T > <threshold>$ GeV)"
  binning:
    min: 0
    max: 100
    step: 1.5

