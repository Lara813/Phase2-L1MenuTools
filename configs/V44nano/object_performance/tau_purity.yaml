Purity_Tau_Barrel:
  sample: VBFHToTauTau
  version: V44nano
  match_test_to_ref: True
  reference_object:
    L1nnPuppiTau:purity:barrel: "pt"
  test_objects:
    GenVisTau:default: "pt"
    L1caloTau:default: "pt"
  xlabel: "L1 nnPuppiTau $p_T$ (GeV)"
  ylabel: "Purity (Barrel)"
  binning:
    min: 0
    max: 100
    step: 3

